# Builds everything and runs the unit and integration tests on every pull
# request and every push to main, the way the owner builds: Windows, MSVC,
# vcpkg, Qt 6.12 and the Vulkan SDK, through the project's presets.
#
# The actions are named by commit and the Vulkan SDK by number, so that a
# commit is built the same way on another day. To take a newer one, change the
# commit and the version in its comment together; the test "release: the
# workflows name exact tools" (cmake/CheckWorkflows.cmake) holds to that.
#
# Benchmarks are left out: shared runners are too noisy for their limits.
# Run them on your own machine (ctest --preset x64-win-msvc2026-benchmarks).
#
# The runner has no graphics card, so the renderer's tests skip themselves
# (they say why in the log); the window's tests run without a screen.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml builds a tag's release with this same job.
  workflow_call:
    inputs:
      package:
        description: A folder to install into, check, zip and keep as the artifact "package". Empty, no package.
        type: string
        default: ''
      version:
        description: The version the packaged program must say it is.
        type: string
        default: ''

# A newer push to the same pull request or branch cancels the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows, MSVC, Release
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # vcpkg keeps what it built here; the cache step below carries it between runs.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # vcpkg is the one that comes with Visual Studio: the developer environment
      # below sets VCPKG_ROOT to it. The versions come from builtin-baseline in vcpkg.json.
      - name: Restore vcpkg's built libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # aqtinstall 3.3.0, the latest release, cannot read Qt 6.11+ on Windows
      # (Qt changed its repository's layout), so a commit of its main branch
      # that can is used. Back to the default once aqtinstall releases it:
      # https://github.com/jurplel/install-qt-action/issues/374
      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          version: 6.12.0
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          vulkan_version: 1.4.363.1
          install_runtime: false
          cache: true
          stripdown: true

      # Puts cl.exe and Ninja on the path, as Visual Studio's developer prompt does.
      - name: Open the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Show the tools in use
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_ROOT"
          (Get-Command cl.exe).Source
          (Get-Command cmake).Source; cmake --version | Select-Object -First 1
          (Get-Command ninja).Source; ninja --version
          & "$env:VCINSTALLDIR/Tools/Llvm/x64/bin/clang-tidy.exe" --version

      - name: Configure
        shell: pwsh
        run: cmake --preset x64-win-msvc2026 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build --preset x64-win-msvc2026-release

      - name: Test
        run: ctest --preset x64-win-msvc2026-ci --output-junit ${{ github.workspace }}\test-results.xml

      # What is handed out: installed into a folder of its own, checked (what
      # is in it, and the installed program is started once), and zipped.
      - name: Install into a folder, start it and zip it
        if: inputs.package != ''
        shell: pwsh
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          cmake "-DBUILD=out/build/x64-win-msvc2026" -DCONFIG=Release "-DFOLDER=$env:GITHUB_WORKSPACE/package/$env:PACKAGE" "-DVERSION=$env:VERSION" -P cmake/CheckPackage.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location package
          cmake -E tar cf "$env:PACKAGE.zip" --format=zip $env:PACKAGE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The debug symbols, apart from the package: a crash dump is read with them.
          Set-Location "$env:GITHUB_WORKSPACE/out/build/x64-win-msvc2026/apps/qt/Release"
          cmake -E tar cf "$env:GITHUB_WORKSPACE/package/$env:PACKAGE-symbols.zip" --format=zip twintailor.pdb

      - name: Keep the package
        if: inputs.package != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: |
            ${{ github.workspace }}\package\${{ inputs.package }}.zip
            ${{ github.workspace }}\package\${{ inputs.package }}-symbols.zip
          if-no-files-found: error

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: ${{ github.workspace }}\test-results.xml
          if-no-files-found: ignore
